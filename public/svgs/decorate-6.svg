<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#e2e8f0" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glass-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" />
    </filter>
  </defs>
  <!-- Capsule body with glass blur -->
  <rect x="120" y="50" width="160" height="300" rx="80" ry="80" fill="url(#grad-6)" transform="rotate(45, 200, 200)" filter="url(#glass-blur)" />
  <!-- Sharp specular highlight on edge -->
  <rect x="120" y="50" width="160" height="300" rx="80" ry="80" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.9" transform="rotate(45, 200, 200)" />
</svg>
